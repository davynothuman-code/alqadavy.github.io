<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pahlawan Nasional Indonesia</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* RESET & GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER & NAVIGATION */
        header {
            background-color: #1a2a3a;
            color: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .logo i {
            color: #e74c3c;
            font-size: 1.5rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: #d1d8e0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        nav a:hover, nav a.active {
            color: #f1c40f;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }

        .hero h1 {
            font-size: 2rem;
            color: #1a2a3a;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero p {
            color: #666;
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* HEROES CARDS CONTAINER */
        .heroes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 1rem 5% 4rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        /* HERO CARD */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
            padding: 1.5rem 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 130px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
            filter: grayscale(20%);
        }

        .card h3 {
            font-size: 1.1rem;
            color: #1a2a3a;
            margin-bottom: 0.3rem;
            font-weight: 700;
        }

        .card .subtitle {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 0.8rem;
            min-height: 32px;
        }

        .card .role {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1.2rem;
            padding: 0.3rem 0.6rem;
            background-color: #ecf0f1;
            border-radius: 4px;
            width: 100%;
        }

        .btn-detail {
            display: inline-block;
            padding: 0.5rem 1rem;
            border: 1px solid #1a2a3a;
            border-radius: 20px;
            color: #1a2a3a;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
